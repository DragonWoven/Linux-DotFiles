general {
    lock_cmd = qs ipc call lockscreen lock
    before_sleep_cmd = qs ipc call lockscreen lock && sleep 0.5
    after_sleep_cmd = wlopm --on '*' && sleep 0.5 && qs ipc call bar refresh
}

listener {
    timeout = 150                               # 2.5 min
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 300                               # 5 min
    on-timeout = loginctl lock-session          # triggers general.lock_cmd
}

listener {
    timeout = 330                               # 5.5 min
    on-timeout = wlopm --off '*'
    on-resume = wlopm --on '*'
}

listener {
    timeout = 600                               # 10 min
    on-timeout = systemctl suspend
}
