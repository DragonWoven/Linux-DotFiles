general {
    lock_cmd = pidof /home/cole/.local/share/quickshell-lockscreen/lock.sh || /home/cole/.local/share/quickshell-lockscreen/lock.sh        # avoid starting multiple lock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = wlopm --on '*'            # turn on display after sleep.
}

listener {
    timeout = 150                               # 2.5 min
    # Save current backlight state and dim to 10%
    on-timeout = brightnessctl -s set 10%
    # Restore the saved backlight state
    on-resume = brightnessctl -r
}

listener {
    timeout = 300                               # 5 min
    on-timeout = loginctl lock-session          # lock screen
}

listener {
    timeout = 330                               # 5.5 min
    on-timeout = wlopm --off '*'                # turn off laptop display backlight via wlroots protocol
    on-resume = wlopm --on '*'                  # turn on display when activity returns
}

listener {
    timeout = 600                               # 10 min
    on-timeout = systemctl suspend              # suspend pc
}
